<body>

    <!-- **************************** -->
    <!-- ********* CABEÇALHO ******** -->
    <!-- **************************** -->

    <header>

        <a href="index.html" class="logo">
            <img src="img/logo.png" alt="Imagem com a logo do site Mapa Solidário." class="logo-mapa-solidario">
        </a>

        <div class="itens">
        
            <nav class="menu">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="como_funciona.html">Como Funciona</a></li>

                    <li><a href="minhas_solicitacoes.html">Minhas Solicitações</a></li>
                </ul>
            </nav>

            
            <div class="entrar">
                <a href="pagina7.html">Entrar</a>
            </div>

        </div>

    </header>

    <!-- **************************** -->
    <!-- ********* CABEÇALHO ******** -->
    <!-- **************************** -->

    <div id="principal">

        <!-- Formulário de Login -->
        <form class="form-login arredondado" action="#" name="form-login">
            <fieldset>
                <legend>Login</legend>
                <div class="form-group">
                    <label for="login-usuario">Usuário ou e-mail</label>
                    <input type="text" name="login-usuario" id="login-usuario" required>
                </div>
                <div class="form-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" name="login-senha" id="login-senha" required>
                </div>

                <a href="minhas_solicitacoes.html" class="btn-login arredondado">Entrar</a>

                <div class="social-area">
                    <a href="#" class="btn-social">
                        <img src="img/images.png" alt="Google"> Google
                    </a>
                    <a href="#" class="btn-social">
                        <img src="img/facebook-logo.svg" alt="Facebook"> Facebook
                    </a>
                </div>
            </fieldset>
        </form>

        <div class="divisor-ou">
            <span>OU</span>
        </div>

        <!-- Formulário de Cadastro -->
        <form class="form-cadastro arredondado" action="#" name="form-cadastro">
            <fieldset>
                <legend>Criar nova conta</legend>
                <div class="form-group">
                    <label for="cad-nome">Nome completo</label>
                    <input type="text" name="cad-nome" id="cad-nome" required>
                </div>
                <div class="form-group">
                    <label for="cad-email">E-mail</label>
                    <input type="email" name="cad-email" id="cad-email" required>
                </div>
                <div class="form-group">
                    <label for="cad-telefone">Telefone</label>
                    <input type="tel" name="cad-telefone" id="cad-telefone" required>
                </div>
                <div class="form-group">
                    <label for="cad-senha">Senha</label>
                    <input type="password" name="cad-senha" id="cad-senha" required>
                </div>
                <div class="form-group">
                    <label for="cad-confirmar">Confirmar senha</label>
                    <input type="password" name="cad-confirmar" id="cad-confirmar" required>
                </div>

                <a href="pagina4.html" class="btn-cadastro arredondado">Criar conta</a>
            </fieldset>
        </form>

        <div class="imagem">
            <img src="img/login_cadastro.png" alt="Ilustração">
        </div>

    </div>

    <!-- **************************** -->
    <!-- ********** RODAPE ********** -->
    <!-- **************************** -->
    
    <footer>


        <div class="icone-rodape">
            <img src="img/logo.png" alt="Imagem com a logo do site Mapa Solidário." class="logo-mapa-solidario">

                    <li><a href="como_funciona.html">Políticas de Privacidade</a></li>
                </ul>
            </nav>
        </div>

        <div class="fale-conosco">
            <span>Fale Conosco</span>
            <P>contato@mapasolidario.com.br</P>
            <nav>
                <ul class="redes-sociais">
                    <li><a href="http://instagram.com/senacrs/" target="_blank"><img src="img/instagram-logo.svg" alt="logo instagram"></a></li>
                    <li><a href="https://www.facebook.com/senacrsoficial" target="_blank"><img src="img/facebook-logo.svg" alt="logo facebook"></a></li>
                    <li><a href="https://wa.me/555189142670" target="_blank"><img src="img/whatsapp-logo.svg" alt="logo whatsapp"></a></li>
                </ul>
            </nav>
        </div>


    </footer>

    <!-- ********** RODAPE ********** -->
    <!-- **************************** -->
</body>

</html>
